function log(msg, cls='') {
  const el = document.getElementById('log');
  const line = document.createElement('span');
  if (cls) line.className = cls;
  line.textContent = msg + '\n';
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

async function upsertLote(items) {
  const resp = await fetch(`${SUPABASE_URL}/rest/v1/equipamentos`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': 'application/json',
      'Prefer': 'resolution=merge-duplicates,return=minimal'
    },
    body: JSON.stringify(items)
  });
  if (!resp.ok) {
    const txt = await resp.text();
    throw new Error(`HTTP ${resp.status}: ${txt}`);
  }
}

async function iniciarImport() {
  const btn = document.getElementById('btnImportar');
  btn.disabled = true;
  document.getElementById('log').textContent = '';

  log(`🚀 Iniciando importação de ${EQUIPAMENTOS.length} equipamentos...`, 'info');
  log(`   Supabase: ${SUPABASE_URL}`, 'info');
  log('');

  let ok = 0, erros = 0;
  const LOTE = 10;

  for (let i = 0; i < EQUIPAMENTOS.length; i += LOTE) {
    const lote = EQUIPAMENTOS.slice(i, i + LOTE);
    const nums = `${i+1}–${Math.min(i+LOTE, EQUIPAMENTOS.length)}`;
    try {
      await upsertLote(lote);
      ok += lote.length;
      const nomes = lote.map(e => e.nome).join(', ');
      log(`✅ [${nums}] OK: ${nomes}`, 'ok');
    } catch(e) {
      erros += lote.length;
      log(`❌ [${nums}] ERRO: ${e.message}`, 'err');
      // Tentar um a um
      for (const item of lote) {
        try {
          await upsertLote([item]);
          ok++;
          erros--;
          log(`   ✅ Recuperado: ${item.nome}`, 'ok');
        } catch(e2) {
          log(`   ❌ Falhou: ${item.nome} — ${e2.message}`, 'err');
        }
      }
    }
    // Pequena pausa para não sobrecarregar
    await new Promise(r => setTimeout(r, 100));
  }

  log('');
  log(`═══════════════════════════════════`, 'info');
  log(`✅ Concluído: ${ok} importados, ${erros} erros`, ok > 0 ? 'ok' : 'err');
  log(`═══════════════════════════════════`, 'info');

  document.getElementById('resumo').style.display = 'block';
  document.getElementById('resumoTexto').innerHTML =
    `<b style="color:#4ade80">${ok} equipamentos</b> importados com sucesso<br>` +
    (erros > 0 ? `<b style="color:#f87171">${erros} erros</b> — veja o log acima` : '') +
    `<br><br>Agora <a href="index.html" style="color:#f59e0b">abra o CRM</a> e o Simulador de String já terá os equipamentos carregados!`;

  btn.disabled = false;
  btn.textContent = '🔄 Reimportar';
}
